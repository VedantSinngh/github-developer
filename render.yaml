services:
  - type: web
    name: candidate-eval-api
    env: python
    buildCommand: "./render_build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: candidate-eval-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

databases:
  - name: candidate-eval-db
    databaseName: candidate_eval
    user: postgres
